<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <section class="menu-section">

        <h2>Special Menu</h2>

        <div class="filter-buttons">
            <button class="active" data-filter="all">All</button>
            <button data-filter="breakfast">Breakfast</button>
            <button data-filter="mains">Mains</button>
            <button data-filter="drinks">Drinks</button>
        </div>

        <div class="menu-container">

            <!-- Card 1 -->
            <div class="menu-card" data-category="breakfast">
                <div class="item-info">
                    <div class="item-header">
                        <h3>Avocado Toast</h3>
                        <span class="line"></span>
                        <span class="price">$8.50</span>
                    </div>
                    <span class="tag">Popular</span>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="menu-card" data-category="mains">
                <div class="item-info">
                    <div class="item-header">
                        <h3>Grilled Chicken Bowl</h3>
                        <span class="line"></span>
                        <span class="price">$13.00</span>
                    </div>
                    <span class="tag">Chef Choice</span>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="menu-card" data-category="drinks">
                <div class="item-info">
                    <div class="item-header">
                        <h3>Iced Caramel Latte</h3>
                        <span class="line"></span>
                        <span class="price">$5.25</span>
                    </div>
                    <span class="tag">New</span>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="menu-card" data-category="mains">
                <div class="item-info">
                    <div class="item-header">
                        <h3>Spicy Arrabbiata Pasta</h3>
                        <span class="line"></span>
                        <span class="price">$11.75</span>
                    </div>
                    <span class="tag">Spicy</span>
                </div>
            </div>

        </div>

    </section>

    <script type="module" src="JS/main.js"></script>
</body>
</html>
